version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: novardesk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: novardesk_db
      MYSQL_USER: novardesk_user
      MYSQL_PASSWORD: novardesk_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
